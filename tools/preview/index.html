<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreshOS • Native live session</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#0b2430;color:#e9fffc;font:14px system-ui}main{height:100%;display:grid;place-items:center}#pc{display:grid;place-items:center;outline:0;width:100%;height:100%;overflow:hidden}#pc canvas{width:100%!important;height:100%!important;object-fit:contain;image-rendering:auto!important;cursor:none}#status{position:absolute;background:#123541ed;padding:14px 22px;border-radius:32px;pointer-events:none}details{position:fixed;bottom:12px;right:12px;max-width:calc(100% - 24px);background:#164556ed;padding:8px 12px;border-radius:17px;box-shadow:0 3px 18px #16455633;font-size:12px}summary{cursor:pointer}details:not([open]){opacity:.4}details:hover,details:focus-within{opacity:1}button,a{color:#113f4e;background:#cbf6ee;border:0;border-radius:14px;padding:7px 10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}nav{display:flex;gap:5px;flex-wrap:wrap;max-width:440px}p{max-width:430px;line-height:1.55}a{display:inline-block;margin:3px 2px 1px 0}
</style><main><div id="pc" tabindex="0" aria-label="Emulated FreshOS computer"><div style="white-space:pre;font:14px/14px monospace"></div><canvas style="display:none"></canvas></div><div id="status" role="status">Starting the FreshOS kernel…</div></main>
<details><summary>Live machine controls</summary><p>This is the native BIOS build running in an x86 emulator. Press Enter to begin. Click the desktop to capture the mouse; Escape releases it when supported. This preview has no writable disk.</p><nav><button data-key="28">Enter</button><button data-key="59">Apps</button><button data-key="15">Next</button><button data-key="60">Tray</button><button data-key="61">GUI / CLI</button><button data-key="62">Minimize</button></nav><p>Download a bootable ISO (ZIP64):<br><a href="FreshOS-Normal.zip" download>Normal</a><a href="FreshOS-Lite.zip" download>Lite</a><a href="FreshOS-VMware.zip" download>VMware</a></p></details>
<script src="libv86.js"></script><script>
const screen=document.querySelector('#pc'),statusEl=document.querySelector('#status');const vm=new V86({wasm_path:'v86.wasm',bios:{url:'seabios.bin'},vga_bios:{url:'vgabios.bin'},cdrom:{url:'preview.iso'},memory_size:32*1024*1024,vga_memory_size:8*1024*1024,screen_container:screen,autostart:true});let log='';vm.add_listener('serial0-output-byte',b=>{log=(log+String.fromCharCode(b)).slice(-120);if(log.includes('welcome ready:'))statusEl.hidden=true;});screen.addEventListener('click',()=>{screen.focus();try{vm.lock_mouse()}catch{}});for(const button of document.querySelectorAll('button[data-key]'))button.onclick=()=>{const k=+button.dataset.key;vm.keyboard_send_scancodes([k,k|128]);screen.focus()};
</script></html>
