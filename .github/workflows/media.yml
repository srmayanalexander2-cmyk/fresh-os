name: Stratus native media
on: [workflow_dispatch, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        edition: [Normal, Lite, VMware, VMware-Lite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential binutils fonts-dejavu-core ovmf qemu-system-x86
          pip install -r requirements.txt
      - run: cc -O2 -Inative/core native/core/math.c native/core/calendar.c native/core/mediafmt.c native/core/base.c qa/core.c -o /tmp/check && /tmp/check
      - run: python forge/media.py ${{ matrix.edition }}
      - run: python qa/boot.py ${{ matrix.edition }}
      - run: python qa/boot.py ${{ matrix.edition }} --efi
      - run: python qa/imp_tool.py ${{ matrix.edition }}
      - run: python qa/packages.py ${{ matrix.edition }}
      - run: python qa/packages.py ${{ matrix.edition }} --efi
      - run: python qa/processes.py ${{ matrix.edition }}
      - run: python qa/layout.py ${{ matrix.edition }}
      - if: matrix.edition == 'VMware-Lite'
        run: |
          python qa/install.py VMware-Lite
          python qa/install.py VMware-Lite --efi
          python qa/vmprofile.py
      - if: matrix.edition == 'Lite'
        run: |
          python qa/recovery.py
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix gcc-mingw-w64-i686-posix
          extras/win-tools/build.sh /tmp/win-tools
          python qa/win_tools.py Lite /tmp/win-tools
          python qa/securitybuf.py Lite
          python qa/guard32.py Lite
          python qa/regpersist.py Lite
          python qa/children.py Lite
          curl -fsSL https://codeload.github.com/kyz/libmspack/tar.gz/8f2a2a91ae2d12f985a196d481962ca4731f0f4d | tar xz -C /tmp
          extras/cabstage/build.sh /tmp/libmspack-8f2a2a91ae2d12f985a196d481962ca4731f0f4d /tmp/stage.exe build/Lite/pe64/KERNEL32.a
          python qa/cabstage.py Lite /tmp/stage.exe
