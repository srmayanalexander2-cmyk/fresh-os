name: Verify and publish Stratus downloads
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  attach:
    if: github.event.release.tag_name == 'v2.0.0-preview.1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Publish the locally boot-tested archives without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          for e in Normal Lite VMware VMware-Lite; do
            p="distros/FreshOS-$e"; expected=$(cut -d' ' -f1 "$p.sha256")
            actual=$(unzip -p "$p.zip" "FreshOS-$e.iso" | sha256sum | cut -d' ' -f1)
            test "$actual" = "$expected"
            unzip -tq "$p.zip"
          done
          gh release upload "$TAG" distros/*.{zip,sha256} --clobber
