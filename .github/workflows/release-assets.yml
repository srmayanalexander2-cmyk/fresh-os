name: Attach verified release media
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  attach:
    if: github.event.release.tag_name == 'v1.2.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Verify and attach exact tested bytes (do not rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for edition in Normal Lite VMware VMware-Lite; do
            archive="releases/FreshOS-$edition.zip"
            iso="FreshOS-$edition.iso"
            expected=$(cut -d' ' -f1 "releases/FreshOS-$edition.sha256")
            actual=$(unzip -p "$archive" "$iso" | sha256sum | cut -d' ' -f1)
            test "$actual" = "$expected"
          done
          gh release upload v1.2.0 releases/FreshOS-{Normal,Lite,VMware,VMware-Lite}.{zip,sha256} --clobber
