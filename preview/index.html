<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stratus · live FreshOS</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d2635;color:#ecfaff;font:15px system-ui,sans-serif}header,footer{display:flex;align-items:center;gap:16px;padding:12px 3vw;flex-wrap:wrap}header{border-bottom:1px solid #375460}strong{font-size:20px}small,footer{color:#b6d2d6}button,a{font:inherit;color:inherit}button{background:#214755;border:1px solid #467078;border-radius:9px;padding:7px 13px;cursor:pointer}button:hover{background:#31636b}a{color:#9ce4cf}header span{flex:1}main{position:relative;display:grid;place-items:center;background:#081a24;min-height:300px}#screen{display:grid;place-items:center;outline:none;width:100%}#screen canvas{max-width:100%;max-height:calc(100dvh - 125px);object-fit:contain}#screen div{white-space:pre;font:14px monospace}#status{position:absolute;background:#163642;padding:12px 18px;border-radius:9px}footer{font-size:13px}#screen:fullscreen{background:#081a24}#screen:fullscreen canvas{max-height:100dvh}</style>
<header><strong>FreshOS</strong><small>STRATUS / NATIVE PREVIEW</small><span></span><button id="start">All apps</button><button id="terminal">Terminal</button><button id="full">Guest F11</button><button id="expand">Expand display</button></header>
<main><div id="screen" tabindex="0" aria-label="FreshOS virtual machine"><div></div><canvas style="display:none"></canvas></div><div id="status">Booting the native kernel…</div></main>
<footer>Emulated PC · click the screen to capture the mouse; Esc releases it. <a href="FreshOS-Normal.zip">Normal</a><a href="FreshOS-Lite.zip">Lite</a><a href="FreshOS-VMware.zip">VMware</a><a href="FreshOS-VMware-Lite.zip">VMware Lite</a></footer>
<script src="libv86.js"></script><script>
const screenEl=document.querySelector('#screen'), statusEl=document.querySelector('#status');
const pc=new V86({wasm_path:'v86.wasm',bios:{url:'seabios.bin'},vga_bios:{url:'vgabios.bin'},cdrom:{url:'live.iso'},hda:{url:'Home.img'},boot_order:0x132,memory_size:64<<20,vga_memory_size:16<<20,screen_container:screenEl,autostart:true,disable_speaker:true});let line='';pc.add_listener('serial0-output-byte',b=>{if(b===10){if(line.includes('workspace ready'))statusEl.hidden=true;line='';}else line=(line+String.fromCharCode(b)).slice(-160)});function key(k){screenEl.focus();pc.keyboard_send_scancodes([k,k|128])}document.querySelector('#start').onclick=()=>key(59);document.querySelector('#terminal').onclick=()=>key(61);document.querySelector('#full').onclick=()=>key(87);document.querySelector('#expand').onclick=()=>screenEl.requestFullscreen().catch(()=>{});screenEl.onclick=()=>{screenEl.focus();pc.lock_mouse()};
</script></html>
